<html>
    <head>
        <body>
            <form>

<form action="/submit_registration.php" method="POST">
        <table border="0" cellpadding="6" cellspacing="0">
            <tr>
                <td><label for="student_name">Full Name:</label></td>
                <td><input type="text" id="student_name" name="student_name" required placeholder="Enter full name"></td>
            </tr>
            <tr>
                <td><label for="email_id">Email Address:</label></td>
                <td><input type="email" id="email_id" name="email_id" required placeholder="username@example.com"></td>
            </tr>
            <tr>
                <td><label for="date_of_birth">Date of Birth (DOB):</label></td>
                <td><input type="date" id="date_of_birth" name="date_of_birth" required></td>
            </tr>
            <tr>
                <td><label for="mobile_number">Mobile Number:</label></td>
                <td><input type="tel" id="mobile_number" name="mobile_number" required placeholder="10-digit mobile number"></td>
            </tr>
            <tr>
                <td><label>Gender:</label></td>
                <td>
                    <input type="radio" id="gender_male" name="gender" value="Male" required>
                    <label for="gender_male">Male</label>
                    <input type="radio" id="gender_female" name="gender" value="Female">
                    <label for="gender_female">Female</label>
                    <input type="radio" id="gender_other" name="gender" value="Other">
                    <label for="gender_other">Other</label>
                </td>
            </tr>
            <tr>
                <td><label for="enrolled_course">Selected Course:</label></td>
                <td>
                    <select id="enrolled_course" name="enrolled_course" required>
                        <option value="">-- Choose Course --</option>
                        <option value="BCA">Bachelor of Computer Applications (BCA)</option>
                        <option value="BTech">B.Tech Computer Science & Engineering</option>
                        <option value="BSc">B.Sc Information Technology</option>
                        <option value="MCA">Master of Computer Applications (MCA)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td valign="top"><label>Hobbies / Extracurriculars:</label></td>
                <td>
                    <input type="checkbox" id="hobby_coding" name="student_hobbies" value="Coding">
                    <label for="hobby_coding">Coding/Hackathons</label><br>
                    <input type="checkbox" id="hobby_sports" name="student_hobbies" value="Sports">
                    <label for="hobby_sports">Sports/Athletics</label><br>
                    <input type="checkbox" id="hobby_arts" name="student_hobbies" value="Arts">
                    <label for="hobby_arts">Music & Arts</label>
                </td>
            </tr>
            <tr>
                <td valign="top"><label for="postal_address">Permanent Address:</label></td>
                <td>
                    <textarea id="postal_address" name="postal_address" rows="4" cols="40" required placeholder="Enter full mailing address..."></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit Registration">
                    <input type="reset" value="Reset Form">
                </td>
            </tr>
        </table>
    </form>

    <br><br>


    

    </body>

</html>
